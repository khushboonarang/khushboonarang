<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#181329"/>
    </linearGradient>

    <!-- Subtle Indigo Radial Glow -->
    <radialGradient id="aim-glow" cx="12%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="aim-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="aim-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <pattern id="aim-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Outer Card Frame -->
  <rect width="920" height="260" rx="14" fill="url(#aim-bg)"/>
  <rect width="920" height="260" rx="14" fill="url(#aim-grid)"/>
  <rect width="920" height="260" rx="14" fill="url(#aim-glow)"/>
  <rect width="920" height="260" rx="14" fill="none" stroke="url(#aim-border)" stroke-width="1.2"/>

  <!-- Left Content Zone -->
  <!-- 1. Category Eyebrow Badge -->
  <g transform="translate(40, 28)">
    <rect width="280" height="24" rx="12" fill="#1C1B33" stroke="#6366F1" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="14" cy="12" r="3" fill="#818CF8"/>
    <text x="24" y="16" class="font-mono" font-size="10" font-weight="700" fill="#A5B4FC" letter-spacing="1">LEARNING HUB • EDTECH &amp; FINANCE</text>
  </g>

  <!-- 2. Project Title & Collaboration Tag -->
  <g transform="translate(40, 78)">
    <text class="font-sans" font-size="24" font-weight="800" fill="url(#aim-title-grad)" letter-spacing="-0.4">AIM4AIR</text>
    <rect x="135" y="-17" width="235" height="20" rx="10" fill="#1E1B4B" stroke="#4338CA" stroke-width="0.8"/>
    <text x="252" y="-3" class="font-mono" font-size="9" font-weight="600" fill="#C7D2FE" text-anchor="middle">BUILT W/ CREATOR VINAYAK</text>
  </g>

  <!-- 3. Subtitle / Core Proposition -->
  <g transform="translate(40, 102)">
    <text class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9" letter-spacing="-0.1">CMA Learning &amp; Opportunity Ecosystem</text>
  </g>

  <!-- 4. One-line Problem Statement -->
  <g transform="translate(40, 126)">
    <text class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">End-to-end study, mentor &amp; corporate articleship pipeline uniting 100k+ CMA aspirants nationwide.</text>
  </g>

  <!-- 5. 2x2 Product Architecture Chips -->
  <g transform="translate(40, 154)">
    <!-- Chip 1: Structured Study Architecture -->
    <g transform="translate(0, 0)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#1E1B4B"/>
      <!-- Roadmap icon -->
      <path d="M 12 21 L 12 17 L 16 15 L 20 17 L 20 21" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Structured Study Roadmap</text>
    </g>

    <!-- Chip 2: Creator-to-Community Flywheel -->
    <g transform="translate(265, 0)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#132724"/>
      <circle cx="16" cy="17" r="4.5" fill="none" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Creator-to-Product Flywheel</text>
    </g>

    <!-- Chip 3: Opportunity & Placement Pipeline -->
    <g transform="translate(0, 42)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#1E293B"/>
      <!-- Briefcase icon -->
      <rect x="11" y="14" width="10" height="7" rx="1.5" stroke="#38BDF8" stroke-width="1" fill="none"/>
      <path d="M 14 14 L 14 12 L 18 12 L 18 14" stroke="#38BDF8" stroke-width="1"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Articleship &amp; Career Engine</text>
    </g>

    <!-- Chip 4: Resource & Mock Test Hub -->
    <g transform="translate(265, 42)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#2E1065"/>
      <path d="M 12 13 L 20 13 M 12 17 L 18 17 M 12 21 L 16 21" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Curated Repository &amp; Mocks</text>
    </g>
  </g>

  <!-- Right Interactive Mockup / Architecture Panel -->
  <g transform="translate(600, 24)">
    <!-- Container Card -->
    <rect width="280" height="212" rx="10" fill="#101026" stroke="#2A244D" stroke-width="1"/>

    <!-- Window Top Header -->
    <rect width="280" height="28" rx="10" fill="#181333"/>
    <rect y="20" width="280" height="8" fill="#181333"/>
    <circle cx="14" cy="14" r="3.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="26" cy="14" r="3.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="38" cy="14" r="3.5" fill="#10B981" opacity="0.8"/>
    <text x="266" y="18" class="font-mono" font-size="8.5" fill="#818CF8" text-anchor="end">ECOSYSTEM // HUB</text>

    <!-- Content 1: Three-Stage Syllabus Funnel -->
    <g transform="translate(14, 40)">
      <rect width="252" height="42" rx="6" fill="#181836" stroke="#4338CA" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="14" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#A5B4FC">CURRICULUM MILESTONES</text>

      <!-- 3 stages indicators -->
      <g transform="translate(14, 25)">
        <rect width="68" height="11" rx="3" fill="#312E81"/>
        <text x="34" y="9" class="font-mono" font-size="7.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">FOUNDATION</text>

        <rect x="74" width="82" height="11" rx="3" fill="#4338CA"/>
        <text x="115" y="9" class="font-mono" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">INTERMEDIATE</text>

        <rect x="162" width="68" height="11" rx="3" fill="#312E81"/>
        <text x="196" y="9" class="font-mono" font-size="7.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">FINAL</text>
      </g>
    </g>

    <!-- Content 2: Community Engagement Modules -->
    <g transform="translate(14, 94)">
      <text x="0" y="10" class="font-mono" font-size="9" fill="#94A3B8">COMMUNITY &amp; CONTENT CHANNELS</text>
      <text x="252" y="10" class="font-mono" font-size="9" font-weight="700" fill="#818CF8" text-anchor="end">INTEGRATED</text>

      <rect y="16" width="252" height="6" rx="3" fill="#1E1B4B"/>
      <rect y="16" width="210" height="6" rx="3" fill="#818CF8"/>
    </g>

    <!-- Content 3: Dual Value Metrics -->
    <g transform="translate(14, 130)">
      <!-- Box A: High-Intent Audience -->
      <rect width="122" height="34" rx="5" fill="#1A183A" stroke="#6366F1" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="15" class="font-mono" font-size="8" font-weight="700" fill="#A5B4FC">AUDIENCE CONVERSION</text>
      <text x="10" y="27" class="font-sans" font-size="9" font-weight="600" fill="#E2E8F0">Organic Creator Reach</text>

      <!-- Box B: Career Placement -->
      <rect x="130" width="122" height="34" rx="5" fill="#122428" stroke="#2DD4BF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="140" y="15" class="font-mono" font-size="8" font-weight="700" fill="#5EEAD4">CAREER ACCESS</text>
      <text x="140" y="27" class="font-sans" font-size="9" font-weight="600" fill="#E2E8F0">Verified Articleships</text>
    </g>

    <!-- Bottom Status Note -->
    <g transform="translate(14, 180)">
      <text x="126" y="16" class="font-mono" font-size="8.5" fill="#64748B" text-anchor="middle">PRODUCT SYSTEM SCALED WITH OFFICE OF VINAYAK</text>
    </g>
  </g>
</svg>