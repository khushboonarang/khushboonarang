<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="eva-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0C1E30"/>
    </linearGradient>

    <!-- Subtle Sky-Blue Radial Glow -->
    <radialGradient id="eva-glow" cx="12%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="eva-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="eva-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <pattern id="eva-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Outer Card Frame -->
  <rect width="920" height="260" rx="14" fill="url(#eva-bg)"/>
  <rect width="920" height="260" rx="14" fill="url(#eva-grid)"/>
  <rect width="920" height="260" rx="14" fill="url(#eva-glow)"/>
  <rect width="920" height="260" rx="14" fill="none" stroke="url(#eva-border)" stroke-width="1.2"/>

  <!-- Left Content Zone -->
  <!-- 1. Category Eyebrow Badge -->
  <g transform="translate(40, 28)">
    <rect width="280" height="24" rx="12" fill="#0C253B" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.6"/>
    <circle cx="14" cy="12" r="3" fill="#38BDF8"/>
    <text x="24" y="16" class="font-mono" font-size="10" font-weight="700" fill="#7DD3FC" letter-spacing="1">WEB PROTOTYPE • FINANCE INTELLIGENCE</text>
  </g>

  <!-- 2. Project Title & Prototype Tag -->
  <g transform="translate(40, 78)">
    <text class="font-sans" font-size="24" font-weight="800" fill="url(#eva-title-grad)" letter-spacing="-0.4">EVALORA AI</text>
    <rect x="175" y="-17" width="105" height="20" rx="10" fill="#082F49" stroke="#0369A1" stroke-width="0.8"/>
    <text x="227" y="-3" class="font-mono" font-size="9" font-weight="700" fill="#7DD3FC" text-anchor="middle">AI PROTOTYPE</text>
  </g>

  <!-- 3. Subtitle / Core Proposition -->
  <g transform="translate(40, 102)">
    <text class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9" letter-spacing="-0.1">Finance Intelligence &amp; Ratio Synthesis Prototype</text>
  </g>

  <!-- 4. One-line Problem Statement -->
  <g transform="translate(40, 126)">
    <text class="font-sans" font-size="12.5" font-weight="400" fill="#94A3B8">Translates complex financial statements and ratios into intuitive, plain-language executive dashboards.</text>
  </g>

  <!-- 5. 2x2 Product Architecture Chips -->
  <g transform="translate(40, 154)">
    <!-- Chip 1: Interactive Ratio Engine -->
    <g transform="translate(0, 0)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#0C253B"/>
      <!-- Calculator / Ratio symbol -->
      <text x="16" y="21" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">%</text>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Interactive Ratio Engine</text>
    </g>

    <!-- Chip 2: Financial Statement Workflows -->
    <g transform="translate(265, 0)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#132724"/>
      <!-- Lightning flow icon -->
      <path d="M 17 12 L 13 17 L 17 17 L 15 22" stroke="#2DD4BF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Automated Statement Workflows</text>
    </g>

    <!-- Chip 3: Plain-Language Synthesis -->
    <g transform="translate(0, 42)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#1E1B4B"/>
      <!-- Speech / AI prompt icon -->
      <rect x="12" y="13" width="9" height="7" rx="1.5" stroke="#818CF8" stroke-width="1" fill="none"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Plain-Language Synthesis</text>
    </g>

    <!-- Chip 4: Non-Technical Visual Dashboards -->
    <g transform="translate(265, 42)">
      <rect width="255" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="9" width="16" height="16" rx="4" fill="#0C253B"/>
      <!-- Chart bar icon -->
      <rect x="12" y="18" width="2" height="4" fill="#38BDF8"/>
      <rect x="15" y="15" width="2" height="7" fill="#38BDF8"/>
      <rect x="18" y="12" width="2" height="10" fill="#38BDF8"/>
      <text x="32" y="22" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Non-Technical Dashboards</text>
    </g>
  </g>

  <!-- Right Interactive Mockup / Architecture Panel -->
  <g transform="translate(600, 24)">
    <!-- Container Card -->
    <rect width="280" height="212" rx="10" fill="#091828" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Window Top Header -->
    <rect width="280" height="28" rx="10" fill="#0E2338"/>
    <rect y="20" width="280" height="8" fill="#0E2338"/>
    <circle cx="14" cy="14" r="3.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="26" cy="14" r="3.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="38" cy="14" r="3.5" fill="#10B981" opacity="0.8"/>
    <text x="266" y="18" class="font-mono" font-size="8.5" fill="#38BDF8" text-anchor="end">INTELLIGENCE // MODEL</text>

    <!-- Content 1: Composite Health Score -->
    <g transform="translate(14, 40)">
      <rect width="252" height="42" rx="6" fill="#0C253B" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="14" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#7DD3FC">FINANCIAL HEALTH SCORE</text>
      <text x="14" y="34" class="font-sans" font-size="14" font-weight="800" fill="#FFFFFF">92 / 100 <tspan font-size="10" font-weight="600" fill="#2DD4BF">● ROBUST SOLVENCY</tspan></text>
      <!-- Circular mini spark score -->
      <circle cx="232" cy="21" r="12" fill="#082F49" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="232" y="24" class="font-mono" font-size="8" font-weight="800" fill="#38BDF8" text-anchor="middle">A+</text>
    </g>

    <!-- Content 2: Multi-Factor Ratio Breakdown -->
    <g transform="translate(14, 94)">
      <!-- Line 1: Quick Ratio -->
      <text x="0" y="10" class="font-mono" font-size="8.5" fill="#94A3B8">CURRENT RATIO (LIQUIDITY)</text>
      <text x="252" y="10" class="font-mono" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="end">2.41x [OPTIMAL]</text>

      <rect y="15" width="252" height="4" rx="2" fill="#1E293B"/>
      <rect y="15" width="200" height="4" rx="2" fill="#38BDF8"/>

      <!-- Line 2: Operating Margin -->
      <text x="0" y="32" class="font-mono" font-size="8.5" fill="#94A3B8">NET PROFIT MARGIN</text>
      <text x="252" y="32" class="font-mono" font-size="8.5" font-weight="700" fill="#2DD4BF" text-anchor="end">18.4% [EXPANDING]</text>

      <rect y="37" width="252" height="4" rx="2" fill="#1E293B"/>
      <rect y="37" width="180" height="4" rx="2" fill="#2DD4BF"/>
    </g>

    <!-- Content 3: Dual Value Output -->
    <g transform="translate(14, 146)">
      <!-- Box A: DuPont Decomposition -->
      <rect width="122" height="28" rx="5" fill="#0C253B" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="10" y="18" class="font-mono" font-size="8" font-weight="700" fill="#7DD3FC">DUPONT DECOMPOSITION</text>

      <!-- Box B: Risk Matrix -->
      <rect x="130" width="122" height="28" rx="5" fill="#132724" stroke="#2DD4BF" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="140" y="18" class="font-mono" font-size="8" font-weight="700" fill="#5EEAD4">SOLVENCY STRESS TEST</text>
    </g>

    <!-- Bottom Status Note -->
    <g transform="translate(14, 185)">
      <text x="126" y="14" class="font-mono" font-size="8.5" fill="#64748B" text-anchor="middle">TRANSFORMING UNSTRUCTURED DATA INTO CLEAR INSIGHTS</text>
    </g>
  </g>
</svg>