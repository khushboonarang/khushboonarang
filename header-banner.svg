<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="teal-glow" cx="18%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigo-glow" cx="82%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Base Card Background -->
  <rect width="920" height="300" rx="16" fill="url(#bg-base)"/>
  <rect width="920" height="300" rx="16" fill="url(#dot-grid)"/>
  <rect width="920" height="300" rx="16" fill="url(#teal-glow)"/>
  <rect width="920" height="300" rx="16" fill="url(#indigo-glow)"/>
  <rect width="920" height="300" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Subtle Corner Grid Lines -->
  <path d="M 16 48 L 48 48 M 48 16 L 48 48" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 904 48 L 872 48 M 872 16 L 872 48" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Left Eyebrow Badge -->
  <g transform="translate(48, 38)">
    <rect width="280" height="26" rx="13" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#2DD4BF" fill-opacity="0.25"/>
    <circle cx="16" cy="13" r="2.5" fill="#2DD4BF"/>
    <text x="28" y="17" class="font-mono" font-size="10" font-weight="600" fill="#2DD4BF" letter-spacing="1">COMMERCE • CORPORATE LAW • MBA</text>
  </g>

  <!-- Right Metadata / Coordinates -->
  <g transform="translate(670, 38)">
    <text x="202" y="17" class="font-mono" font-size="10.5" fill="#64748B" text-anchor="end" letter-spacing="0.8">PRACTICAL WEB TOOLS &amp; WORKFLOWS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(48, 114)">
    <text class="font-sans" font-size="38" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">KHUSHBOO NARANG</text>
  </g>

  <!-- Subtitle with Accent Rule -->
  <g transform="translate(48, 148)">
    <!-- Tiny color accent line -->
    <rect x="0" y="2" width="3" height="18" rx="1.5" fill="url(#accent-grad)"/>
    <text x="14" y="16" class="font-sans" font-size="15" font-weight="600" fill="#E2E8F0" letter-spacing="-0.2">Commerce, Corporate Law &amp; MBA (Finance/HRM) <tspan fill="#64748B">•</tspan> <tspan fill="#CBD5E1">Practical Web Tools</tspan></text>
  </g>

  <!-- Tagline -->
  <g transform="translate(48, 184)">
    <text class="font-sans" font-size="14.5" font-style="normal" font-weight="400" fill="#94A3B8" letter-spacing="-0.1">“Building practical web tools across finance, EdTech &amp; consumer utility.”</text>
  </g>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(48, 230)">
    <!-- Pill 1: Web Tool Design -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="8" fill="#131F2A" stroke="#2DD4BF" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="18" cy="17" r="3" fill="#2DD4BF"/>
      <text x="30" y="21" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">Interactive Web Tools</text>
    </g>

    <!-- Pill 2: FinTech & Regulatory Workflows -->
    <g transform="translate(222, 0)">
      <rect width="225" height="34" rx="8" fill="#191B33" stroke="#818CF8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="18" cy="17" r="3" fill="#818CF8"/>
      <text x="30" y="21" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">FinTech &amp; Legal Workflows</text>
    </g>

    <!-- Pill 3: Creator Collaborations -->
    <g transform="translate(459, 0)">
      <rect width="200" height="34" rx="8" fill="#132130" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="18" cy="17" r="3" fill="#38BDF8"/>
      <text x="30" y="21" class="font-sans" font-size="12" font-weight="600" fill="#E2E8F0">Creator Collaborations</text>
    </g>
  </g>

  <!-- Right Schematic Visual / Intersection Diagram -->
  <g transform="translate(735, 175)">
    <!-- Outer faint orbits -->
    <circle cx="65" cy="10" r="72" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>
    <circle cx="65" cy="10" r="48" fill="none" stroke="#475569" stroke-width="1" opacity="0.45"/>

    <!-- Central Node -->
    <circle cx="65" cy="10" r="14" fill="#1E293B" stroke="#2DD4BF" stroke-width="1.8"/>
    <circle cx="65" cy="10" r="6" fill="#2DD4BF"/>

    <!-- Intersecting Nodes -->
    <!-- Top-Left: Law -->
    <line x1="65" y1="10" x2="30" y2="-32" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="30" cy="-32" r="11" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2"/>
    <text x="30" y="-28" class="font-mono" font-size="8.5" font-weight="700" fill="#A5B4FC" text-anchor="middle">LAW</text>

    <!-- Top-Right: Finance -->
    <line x1="65" y1="10" x2="108" y2="-28" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="108" cy="-28" r="11" fill="#0C253B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="108" y="-24" class="font-mono" font-size="8.5" font-weight="700" fill="#7DD3FC" text-anchor="middle">FIN</text>

    <!-- Bottom: Tech -->
    <line x1="65" y1="10" x2="65" y2="58" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="65" cy="58" r="11" fill="#062E25" stroke="#2DD4BF" stroke-width="1.2"/>
    <text x="65" y="62" class="font-mono" font-size="8.5" font-weight="700" fill="#5EEAD4" text-anchor="middle">TECH</text>

    <!-- Connection label -->
    <text x="65" y="-55" class="font-mono" font-size="9" fill="#64748B" text-anchor="middle" letter-spacing="0.5">INTERSECTION</text>
  </g>
</svg>